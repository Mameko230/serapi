<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Serapi icon directions</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#e9e3d8;font-family:"Microsoft YaHei UI","Segoe UI",sans-serif;color:#201d19;padding:36px 42px}
  h1{font-family:Georgia,serif;font-size:28px;margin:0 0 4px;letter-spacing:-.4px}
  .sub{color:#776f63;font-size:12px;margin-bottom:26px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .card{background:rgba(253,251,247,.76);border:1px solid rgba(255,255,255,.8);border-radius:22px;padding:18px;box-shadow:0 16px 44px rgba(60,45,30,.08)}
  .name{font-size:13px;font-weight:700;margin:0 0 2px}
  .note{font-size:10px;color:#a69d90;margin-bottom:16px}
  .hero{width:100%;aspect-ratio:1;border-radius:24px;display:grid;place-items:center;background:linear-gradient(145deg,#f8f4ec,#e5ded1)}
  .hero img{width:72%}
  .sizes{display:flex;align-items:end;gap:16px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(65,55,43,.1)}
  .sizes div{display:flex;flex-direction:column;align-items:center;gap:6px;color:#a69d90;font-size:9px}
  .sizes img{display:block}
  .dark-row{margin-top:22px;padding:18px;border-radius:22px;background:#171a1b;display:flex;align-items:center;gap:22px;color:#d6d0c6}
  .dark-row .label{font-size:11px;color:#a59d91;min-width:100px}
  .dark-row img{border-radius:22%}
</style>
</head>
<body>
  <h1>Serapi · icon directions</h1>
  <div class="sub">A / B / C · 同一套深青墨绿、暖纸色与金铜色；16px 仍然可读。</div>

  <div class="grid">
    <div class="card">
      <div class="name">A · 双段桥</div>
      <div class="note">两块段落卡 + 双向译路箭头；最贴近“翻译段”这项工作。</div>
      <div class="hero"><img src="icon-a.svg" alt="A"></div>
      <div class="sizes">
        <div><img src="icon-a.svg" width="48" height="48" alt=""><span>48</span></div>
        <div><img src="icon-a.svg" width="32" height="32" alt=""><span>32</span></div>
        <div><img src="icon-a.svg" width="16" height="16" alt=""><span>16</span></div>
      </div>
    </div>
    <div class="card">
      <div class="name">B · 语际括号</div>
      <div class="note">左右成对的语际括号，中央节点像光标；更抽象、更像品牌符号。</div>
      <div class="hero"><img src="icon-b.svg" alt="B"></div>
      <div class="sizes">
        <div><img src="icon-b.svg" width="48" height="48" alt=""><span>48</span></div>
        <div><img src="icon-b.svg" width="32" height="32" alt=""><span>32</span></div>
        <div><img src="icon-b.svg" width="16" height="16" alt=""><span>16</span></div>
      </div>
    </div>
    <div class="card">
      <div class="name">C · 拱桥</div>
      <div class="note">两种语言之间的桥；最稳重，最像工具品牌。</div>
      <div class="hero"><img src="icon-c.svg" alt="C"></div>
      <div class="sizes">
        <div><img src="icon-c.svg" width="48" height="48" alt=""><span>48</span></div>
        <div><img src="icon-c.svg" width="32" height="32" alt=""><span>32</span></div>
        <div><img src="icon-c.svg" width="16" height="16" alt=""><span>16</span></div>
      </div>
    </div>
  </div>

  <div class="dark-row">
    <span class="label">暗色任务栏</span>
    <img src="icon-a.svg" width="48" height="48" alt="">
    <img src="icon-b.svg" width="48" height="48" alt="">
    <img src="icon-c.svg" width="48" height="48" alt="">
    <span class="label">48px · 深色背景</span>
  </div>
</body>
</html>
