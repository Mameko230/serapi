name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Offline regression
        shell: pwsh
        run: |
          python -m py_compile (Get-ChildItem app\*.py).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($t in Get-ChildItem tests\test_*.py) {
            python -u $t.FullName
            if ($LASTEXITCODE -ne 0) { throw "failed: $($t.Name)" }
          }
          node --check app/bridge.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($t in Get-ChildItem tests\test_*.js) {
            node $t.FullName
            if ($LASTEXITCODE -ne 0) { throw "failed: $($t.Name)" }
          }

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $wanted = $tag -replace '^v', ''
          $match = Select-String -Path app\version.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"'
          if (-not $match) { throw "APP_VERSION not found in app/version.py" }
          $appVer = $match.Matches[0].Groups[1].Value
          if ($wanted -ne $appVer) { throw "tag $tag does not match APP_VERSION $appVer" }
          Write-Host "version ok: $appVer"

      - name: Build portable (PyInstaller onedir)
        run: pyinstaller --noconfirm Serapi.spec

      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Serapi\* -DestinationPath dist\Serapi-win64.zip -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if (-not $ver -or $ver -eq "") { $ver = "dev" }
          $ver = $ver -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$ver" "/DMyAppOwner=${{ github.repository_owner }}" `
            "installer\Serapi.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Serapi-win64.zip
            installer/Output/Serapi-Setup.exe
          fail_on_unmatched_files: false

      - name: Upload artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Serapi-win64
          path: dist/Serapi-win64.zip
