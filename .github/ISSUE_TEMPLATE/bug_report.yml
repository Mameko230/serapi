name: Bug report
description: Something is broken in Serapi
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** paste customer text, project names, GUIDs, URLs or screenshots with real content.
        Replace them with `<project>`, `<doc>`, `<text>`, `<guid>`.
  - type: input
    id: version
    attributes:
      label: Serapi version
      placeholder: 1.0.3
    validations:
      required: true
  - type: dropdown
    id: editor
    attributes:
      label: Editor
      options: [New editor, Old editor, Not sure]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Sanitized only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected / actual
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed real project text, URLs, GUIDs and user names.
          required: true
